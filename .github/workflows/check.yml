name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated lexicon types match lexicons/
        run: node scripts/lexicons.mjs && git diff --exit-code src/lexicons.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
