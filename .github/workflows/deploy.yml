name: Deploy

# Deploys main to Cloudflare: D1 migrations first, then the Worker.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# D1: Edit, Workers Routes: Edit on hikeratlas.com) and CLOUDFLARE_ACCOUNT_ID;
# until they're set, it does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set: not deploying"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        run: npx wrangler d1 migrations apply indexer --remote
      - if: steps.gate.outputs.go == 'true'
        run: npx wrangler deploy
